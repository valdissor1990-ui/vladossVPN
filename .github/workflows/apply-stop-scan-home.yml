name: Apply stop-scan home button fix
# Retired: the code this patched is already on main. Kept only for history;
# manual dispatch is a no-op so nobody can re-apply a stale/broken patch.
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Retired
        run: |
          echo "This legacy apply-* workflow is retired."
          echo "The stop-scan home button fix is already merged on main."
          echo "Do not re-enable push triggers or re-run patch scripts."
