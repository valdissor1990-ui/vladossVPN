name: Debug APK

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# APK packaging includes several large native libraries; use the same heap size as release CI.
env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  direct-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Bootstrap Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x ./gradlew

      - name: Download libbox
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh

      - name: Report diagnostic build revision
        run: echo "Diagnostic build commit=$(git rev-parse HEAD)"

      - name: Compile Direct Debug Kotlin
        run: ./gradlew :app:compileDirectDebugKotlin --stacktrace

      - name: Build Direct Debug APK
        run: ./gradlew clean :app:assembleDirectDebug --stacktrace

      - name: Upload Direct Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: vladossvpn-direct-debug-apk
          path: app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error
          retention-days: 14
