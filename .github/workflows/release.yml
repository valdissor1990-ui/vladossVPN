name: Build, Sign & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
  APP_VERSION_NAME: "1.0.770"
  APP_VERSION_CODE: "10770"

jobs:
  build-and-release:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c17d6abeba8055" \
            "d56f5187479451eabf01fb78af6dfdd0903112cd" \
            "24333f8a63b6825ea9c5514f83c17d6abeba8055" \
            > "$SDK/licenses/android-sdk-license"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "KEYSTORE_PATH=$PWD/keystore.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret; release will use debug signing"
          fi

      - name: Build release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDirectRelease :app:bundlePlayRelease --stacktrace

      - name: Detect version from APK
        id: ver
        run: |
          set -euo pipefail
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name aapt2 2>/dev/null | head -1)
          if [ -z "$AAPT" ]; then
            AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name aapt 2>/dev/null | head -1)
          fi
          APK=$(ls app/build/outputs/apk/direct/release/*universal*release.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(ls app/build/outputs/apk/direct/release/*release.apk 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "❌ No release APK found. Directory listing:"
            ls -la app/build/outputs/apk/direct/release/ || true
            exit 1
          fi
          echo "Using APK: $APK"
          VN=$("$AAPT" dump badging "$APK" | head -1 | sed -E "s/.*versionName='([^']+)'.*/\1/")
          VC=$("$AAPT" dump badging "$APK" | head -1 | sed -E "s/.*versionCode='([^']+)'.*/\1/")
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Detected $VN ($VC)"

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo "changelog<<EOF"
            echo "## Что нового"
            git log -20 --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD || git log -20 --pretty=format:"- %s (%h)"
            echo ""
            echo "**Full SHA:** \`${{ github.sha }}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate version.json
        run: |
          mkdir -p release-meta
          cat > release-meta/version.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}"
          }
          EOF
          cat release-meta/version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-direct-${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/direct/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: aab-play-${{ steps.ver.outputs.name }}
          path: app/build/outputs/bundle/playRelease/*.aab

      - name: Verify release APK files exist
        run: |
          set -euo pipefail
          DIR=app/build/outputs/apk/direct/release
          for f in \
            "$DIR/app-direct-universal-release.apk" \
            "$DIR/app-direct-arm64-v8a-release.apk" \
            "$DIR/app-direct-armeabi-v7a-release.apk" \
            "$DIR/app-direct-x86_64-release.apk"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing expected APK: $f"
              echo "Directory contents:"
              ls -la "$DIR"
              exit 1
            fi
            echo "✅ $f ($(du -h "$f" | cut -f1))"
          done

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: VPNProxy v${{ steps.ver.outputs.name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            app/build/outputs/apk/direct/release/app-direct-*-release.apk
            app/build/outputs/bundle/playRelease/*.aab
            LICENSE
            THIRD_PARTY_NOTICES.md
            license-notices.zip
            app/src/main/assets/licenses/GPL-3.0-or-later.txt
            app/src/main/assets/licenses/sing-box-lx-NOTICE.txt
            docs/OPEN_SOURCE_COMPLIANCE.md
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
