name: Build, Sign & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK/licenses/android-sdk-license"
          printf '%s\n' \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$SDK/licenses/android-sdk-preview-license"
          printf '%s\n' \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK/licenses/android-sdk-arm-dbt-license"
          CMDLINE=$(find "$SDK/cmdline-tools" -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$CMDLINE" ]; then
            yes | "$CMDLINE" --sdk_root="$SDK" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              || true
          fi
          echo "SDK ready at $SDK"

      - name: Bootstrap Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Download full libbox 1.14.3
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh
          unzip -p app/libs/libbox.aar classes.jar > /tmp/libbox-classes.jar
          jar tf /tmp/libbox-classes.jar | grep -q "^io/nekohasekai/libbox/PlatformInterface.class$"
          jar tf /tmp/libbox-classes.jar | grep -q "^go/Seq.class$"
          echo "Verified full libbox 1.14.3 with Go bridge classes"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "::error::KEYSTORE_BASE64 is required for a production release"
              exit 1
            fi
            echo "Release signing secrets unavailable (non-release build); Gradle may use debug signing."
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name secret is required for a production release"
                exit 1
              fi
            done
          fi
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r \t')
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.keystore"
          SIZE=$(wc -c < "$RUNNER_TEMP/release.keystore")
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore too small ($SIZE bytes) — check KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "Keystore decoded OK ($SIZE bytes)"

      - name: Build Direct Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDirectRelease --stacktrace

      - name: Validate every APK before publishing
        shell: bash
        run: |
          set -Eeuo pipefail
          DIR="app/build/outputs/apk/direct/release"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          test -x "$ZIPALIGN" || { echo "::error::zipalign not found"; exit 1; }
          test -x "$AAPT" || { echo "::error::aapt not found"; exit 1; }

          shopt -s nullglob
          apks=("$DIR"/*.apk)
          (("${#apks[@]}" >= 4)) || { echo "::error::Expected universal + 3 ABI APKs; found ${#apks[@]}"; ls -la "$DIR"; exit 1; }

          expected_version="${GITHUB_RUN_NUMBER:-0}"
          cert_digest=""
          for apk in "${apks[@]}"; do
            echo "::group::Validate $apk"
            test -s "$apk"
            unzip -t "$apk"
            "$ZIPALIGN" -c -P 16 -v 4 "$apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            badging="$("$AAPT" dump badging "$apk")"
            echo "$badging" | grep -q "^package: name='com\.vpnproxy\.direct' "
            echo "$badging" | grep -q "^sdkVersion:'26'$"
            version_name="$(printf '%s\n' "$badging" | sed -n "1s/.*versionName='\([^']*\)'.*/\1/p")"
            version_code="$(printf '%s\n' "$badging" | sed -n "1s/.*versionCode='\([^']*\)'.*/\1/p")"
            test -n "$version_name" && test -n "$version_code"
            echo "Package/version: com.vpnproxy.direct $version_name ($version_code)"
            cert="$( "$APKSIGNER" verify --print-certs "$apk" | sed -n -E 's/^(Signer #1 certificate SHA-256 digest: |V[0-9]+ Signer: certificate SHA-256 digest: )//p' | head -1 )"
            test -n "$cert" || { echo "::error::No signer certificate found in $apk"; exit 1; }
            if [ -z "$cert_digest" ]; then cert_digest="$cert"; elif [ "$cert" != "$cert_digest" ]; then
              echo "::error::APK signing certificate differs between split artifacts"
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              if [[ "$version_name" != *.*.* ]]; then
                echo "::error::Unexpected release versionName: $version_name"
                exit 1
              fi
              if [[ "$version_code" != 1* ]]; then
                echo "::error::Unexpected release versionCode: $version_code"
                exit 1
              fi
            fi
            echo "::endgroup::"
          done
          echo "All direct-release APKs passed ZIP, alignment, package, SDK and signature checks."
          echo "Signing certificate SHA-256: $cert_digest"

      - name: Verify APK excludes retired native cores and secondary process
        run: |
          set -euo pipefail
          if grep -q 'android:process=":singbox"' app/src/main/AndroidManifest.xml; then
            echo "Unexpected :singbox process declaration"
            exit 1
          fi
          found=0
          while IFS= read -r apk; do
            found=1
            if unzip -l "$apk" | grep -E 'libv2ray\.so|libhev-socks5-tunnel\.so'; then
              echo "Retired native core found in $apk"
              exit 1
            fi
          done < <(find app/build/outputs/apk/direct/release -name '*.apk' -type f)
          test "$found" -eq 1
          echo "Verified direct APKs contain neither retired native core"

      - name: Build Play Release AAB
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease --stacktrace

      - name: Extract version info
        id: ver
        run: |
          set -euo pipefail

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          if [ -z "$AAPT" ]; then
            echo "❌ aapt2 not found in \$ANDROID_HOME/build-tools"
            exit 1
          fi

          # Gradle flavor+splits naming: app-<flavor>-<abi>-<buildType>.apk
          APK=app/build/outputs/apk/direct/release/app-direct-universal-release.apk

          # Fallback: any APK if universal missing (defensive)
          if [ ! -f "$APK" ]; then
            APK=$(find app/build/outputs/apk/direct/release -name 'app-direct-*-release.apk' | head -1)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "❌ No release APK found. Directory listing:"
            ls -la app/build/outputs/apk/direct/release/ || true
            exit 1
          fi

          echo "Using APK: $APK"
          VN=$("$AAPT" dump badging "$APK" | head -1 | sed -E "s/.*versionName='([^']+)'.*/\1/")
          VC=$("$AAPT" dump badging "$APK" | head -1 | sed -E "s/.*versionCode='([^']+)'.*/\1/")
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Detected $VN ($VC)"

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo "changelog<<EOF"
            echo "## Что нового"
            git log -20 --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD || git log -20 --pretty=format:"- %s (%h)"
            echo ""
            echo "**Full SHA:** \`${{ github.sha }}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate version.json
        run: |
          mkdir -p release-meta
          cat > release-meta/version.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}"
          }
          EOF
          cat release-meta/version.json

      - name: Install APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/direct/release/app-direct-universal-release.apk
            adb shell pm path com.vpnproxy.direct
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-direct-${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/direct/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: aab-play-${{ steps.ver.outputs.name }}
          path: app/build/outputs/bundle/playRelease/*.aab

      - name: Verify release APK files exist
        run: |
          set -euo pipefail
          DIR=app/build/outputs/apk/direct/release
          for f in \
            "$DIR/app-direct-universal-release.apk" \
            "$DIR/app-direct-arm64-v8a-release.apk" \
            "$DIR/app-direct-armeabi-v7a-release.apk" \
            "$DIR/app-direct-x86_64-release.apk"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing expected APK: $f"
              echo "Directory contents:"
              ls -la "$DIR"
              exit 1
            fi
            echo "✅ $f ($(du -h "$f" | cut -f1))"
          done

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: VPNProxy v${{ steps.ver.outputs.name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            app/build/outputs/apk/direct/release/app-direct-*-release.apk
            app/build/outputs/bundle/playRelease/*.aab
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
