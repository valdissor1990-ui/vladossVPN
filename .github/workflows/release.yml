name: Build, Sign & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Bootstrap Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          # Prefer existing versionName from gradle if present; otherwise bump last release tag
          CURRENT=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/' || true)
          if [ -z "$CURRENT" ]; then CURRENT="1.0.0"; fi
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$CURRENT"

      - name: Write SOURCE_COMMIT
        run: |
          mkdir -p app/src/main/assets/licenses
          cat > app/src/main/assets/licenses/SOURCE_COMMIT.txt <<EOF
          VLADOSS VPN source commit: $GITHUB_SHA
          Source: https://github.com/valdissor1990-ui/vladossVPN/tree/$GITHUB_SHA
          Bundled libbox source: https://github.com/Leadaxe/sing-box-lx/tree/v1.14.3-lx.23
          Bundled cronet-go wrapper: https://github.com/SagerNet/cronet-go/tree/0d28acc44093df24b2526dea3d6ffefd6b0a54f0
          Bundled libcronet.a source: https://github.com/SagerNet/naiveproxy/tree/72a06c9fca0e2d228588c7f3074bf7efff3ff686
          EOF

      - name: Download full libbox 1.14.3-lx.23
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh
          unzip -p app/libs/libbox.aar classes.jar > /tmp/libbox-classes.jar
          jar tf /tmp/libbox-classes.jar | grep -q "^io/nekohasekai/libbox/PlatformInterface.class$"
          jar tf /tmp/libbox-classes.jar | grep -q "^go/Seq.class$"
          echo "Verified full libbox 1.14.3-lx.23 with Go bridge classes"

      - name: Audit bundled libbox Go dependencies
        run: bash scripts/audit_libbox_licenses.sh

      - name: Verify license inventory presence
        run: |
          set -euo pipefail
          test -s app/src/main/assets/licenses/libbox-go-licenses.csv
          test -s app/src/main/assets/licenses/libbox/cronet-naiveproxy/LICENSE
          test -s app/src/main/assets/licenses/libbox/cronet-naiveproxy/src/LICENSE
          test -d app/src/main/assets/licenses/libbox
          test "$(find app/src/main/assets/licenses/libbox -type f | wc -l)" -gt 0

      - name: Build Direct Release APK
        run: ./gradlew assembleDirectRelease --stacktrace

      - name: Build Play Release AAB
        run: ./gradlew bundlePlayRelease --stacktrace

      - name: Package license notices
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/license-notices.zip app/src/main/assets/licenses app/build/reports/license-audit || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/direct/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
            dist/license-notices.zip
