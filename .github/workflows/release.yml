name: Build, Sign & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional explicit versionName (X.Y.Z). Leave empty to auto-increment from latest tag."
        required: false
        type: string

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    concurrency:
      # Never cancel a release mid-flight: partial APK upload + missing tag is worse than queueing.
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve unique version (fail if tag already exists)
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          set -euo pipefail

          # Latest semantic tag on this repo (vX.Y.Z). Ignore non-matching tags.
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -z "${LATEST_TAG}" ]; then
            BASE_MAJOR=1
            BASE_MINOR=0
            BASE_PATCH=0
            LATEST_CODE=10700
          else
            VER="${LATEST_TAG#v}"
            BASE_MAJOR=$(printf '%s' "$VER" | cut -d. -f1)
            BASE_MINOR=$(printf '%s' "$VER" | cut -d. -f2)
            BASE_PATCH=$(printf '%s' "$VER" | cut -d. -f3)
            # Prefer versionCode from previous release assets when present; else derive.
            LATEST_CODE=$((10000 + BASE_MAJOR * 1000 + BASE_MINOR * 100 + BASE_PATCH))
          fi

          if [ -n "${INPUT_VERSION:-}" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version_name must be X.Y.Z (got: ${INPUT_VERSION})"
              exit 1
            fi
            NEXT_NAME="$INPUT_VERSION"
            NEXT_MAJOR=$(printf '%s' "$NEXT_NAME" | cut -d. -f1)
            NEXT_MINOR=$(printf '%s' "$NEXT_NAME" | cut -d. -f2)
            NEXT_PATCH=$(printf '%s' "$NEXT_NAME" | cut -d. -f3)
          else
            NEXT_MAJOR=$BASE_MAJOR
            NEXT_MINOR=$BASE_MINOR
            NEXT_PATCH=$((BASE_PATCH + 1))
            NEXT_NAME="${NEXT_MAJOR}.${NEXT_MINOR}.${NEXT_PATCH}"
          fi

          NEXT_CODE=$((LATEST_CODE + 1))
          # Ensure monotonic code even if name was set explicitly below a previous code.
          if [ "$NEXT_CODE" -le "$LATEST_CODE" ]; then
            NEXT_CODE=$((LATEST_CODE + 1))
          fi

          TAG="v${NEXT_NAME}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Git tag ${TAG} already exists. Refusing to reuse version. Bump explicitly or delete the tag only if it was never published."
            exit 1
          fi

          # Also refuse if a GitHub Release already claims this tag (orphan release edge case).
          if command -v gh >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "::error::GitHub Release ${TAG} already exists. Refusing duplicate publish."
              exit 1
            fi
          fi

          echo "name=${NEXT_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${NEXT_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version ${NEXT_NAME} (${NEXT_CODE}) tag=${TAG} (previous=${LATEST_TAG:-none})"

          # Export for Gradle (app/build.gradle.kts reads APP_VERSION_* from env).
          echo "APP_VERSION_NAME=${NEXT_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${NEXT_CODE}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK/licenses/android-sdk-license"
          printf '%s\n' \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$SDK/licenses/android-sdk-preview-license"
          printf '%s\n' \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK/licenses/android-sdk-arm-dbt-license"
          CMDLINE=$(find "$SDK/cmdline-tools" -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$CMDLINE" ]; then
            yes | "$CMDLINE" --sdk_root="$SDK" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              || true
          fi
          echo "SDK ready at $SDK"

      - name: Bootstrap and verify Gradle Wrapper JAR
        env:
          WRAPPER_JAR_SHA256: ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0
          GRADLE_DIST_SHA256: 7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301fa7fa7e9407bd24
        run: |
          set -euo pipefail
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
              -o "$RUNNER_TEMP/gradle-8.14.6-bin.zip" \
              https://services.gradle.org/distributions/gradle-8.14.6-bin.zip
            echo "${GRADLE_DIST_SHA256}  $RUNNER_TEMP/gradle-8.14.6-bin.zip" | sha256sum --check
            unzip -p "$RUNNER_TEMP/gradle-8.14.6-bin.zip" \
              gradle-8.14.6/lib/plugins/gradle-wrapper-main-8.14.6.jar \
              > "$RUNNER_TEMP/gradle-wrapper-main.jar"
            unzip -p "$RUNNER_TEMP/gradle-wrapper-main.jar" gradle-wrapper.jar \
              > gradle/wrapper/gradle-wrapper.jar
          fi
          echo "${WRAPPER_JAR_SHA256}  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
          chmod +x gradlew || true

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Record exact source revision in license assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/licenses
          cat > app/src/main/assets/licenses/SOURCE_COMMIT.txt <<EOF
          VLADOSS VPN source commit: $GITHUB_SHA
          Source: https://github.com/valdissor1990-ui/vladossVPN/tree/$GITHUB_SHA
          Release version: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          Bundled libbox source: https://github.com/Leadaxe/sing-box-lx/tree/v1.14.3-lx.23
          Bundled cronet-go wrapper: https://github.com/SagerNet/cronet-go/tree/0d28acc44093df24b2526dea3d6ffefd6b0a54f0
          Bundled libcronet.a source: https://github.com/SagerNet/naiveproxy/tree/72a06c9fca0e2d228588c7f3074bf7efff3ff686
          EOF

      - name: Download full libbox 1.14.3
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh
          unzip -p app/libs/libbox.aar classes.jar > /tmp/libbox-classes.jar
          jar tf /tmp/libbox-classes.jar | grep -q "^io/nekohasekai/libbox/PlatformInterface.class$"
          jar tf /tmp/libbox-classes.jar | grep -q "^go/Seq.class$"
          echo "Verified full libbox 1.14.3 with Go bridge classes"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false

      - name: Audit bundled libbox Go dependencies
        run: bash scripts/audit_libbox_licenses.sh

      - name: Verify native license audit output
        run: |
          set -euo pipefail
          test -s app/src/main/assets/licenses/libbox-go-licenses.csv
          test -s app/src/main/assets/licenses/cronet-native-licenses.csv
          test -s app/src/main/assets/licenses/cronet-native-NOTICE.txt
          test -s app/src/main/assets/licenses/libbox/cronet-naiveproxy/LICENSE
          test -s app/src/main/assets/licenses/libbox/cronet-naiveproxy/src/LICENSE
          test -d app/src/main/assets/licenses/libbox
          test "$(find app/src/main/assets/licenses/libbox -type f | wc -l)" -gt 0

      - name: Generate dependency license report
        run: ./gradlew :app:generateLicenseReport --no-parallel --stacktrace

      - name: Upload dependency license report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-license-report
          path: |
            app/build/reports/dependency-license/**
            app/build/reports/license-audit/**
          if-no-files-found: warn

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is required for a production release"
              exit 1
            fi
          done
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r \t')
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.keystore"
          SIZE=$(wc -c < "$RUNNER_TEMP/release.keystore")
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore too small ($SIZE bytes) — check KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "Keystore decoded OK ($SIZE bytes)"

      - name: Build Direct Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: ./gradlew assembleDirectRelease --stacktrace

      - name: Verify APK excludes retired native cores and secondary process
        run: |
          set -euo pipefail
          if grep -q 'android:process=":singbox"' app/src/main/AndroidManifest.xml; then
            echo "Unexpected :singbox process declaration"
            exit 1
          fi
          found=0
          while IFS= read -r apk; do
            found=1
            if unzip -l "$apk" | grep -E 'libv2ray\.so|libhev-socks5-tunnel\.so'; then
              echo "Retired native core found in $apk"
              exit 1
            fi
          done < <(find app/build/outputs/apk/direct/release -name '*.apk' -type f)
          test "$found" -eq 1
          echo "Verified direct APKs contain neither retired native core"

      - name: Build Play Release AAB
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: ./gradlew bundlePlayRelease --stacktrace

      - name: Verify bundled open-source license assets
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/direct/release/app-direct-universal-release.apk
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          test -f "$APK"
          test -f "$AAB"
          unzip -l "$APK" | grep -q 'assets/licenses/GPL-3.0-or-later.txt'
          unzip -l "$APK" | grep -q 'assets/licenses/SOURCE_COMMIT.txt'
          unzip -l "$APK" | grep -q 'assets/licenses/sing-box-lx-NOTICE.txt'
          unzip -l "$APK" | grep -q 'assets/licenses/libbox-go-licenses.csv'
          unzip -l "$APK" | grep -q 'assets/licenses/cronet-native-licenses.csv'
          unzip -l "$APK" | grep -q 'assets/licenses/cronet-native-NOTICE.txt'
          unzip -l "$APK" | grep -q 'assets/licenses/libbox/cronet-naiveproxy/LICENSE'
          unzip -l "$APK" | grep -q 'assets/licenses/libbox/cronet-naiveproxy/src/LICENSE'
          unzip -l "$APK" | grep -q 'assets/licenses/libbox/'
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/GPL-3.0-or-later.txt'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/SOURCE_COMMIT.txt'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/sing-box-lx-NOTICE.txt'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/libbox-go-licenses.csv'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/cronet-native-licenses.csv'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/cronet-native-NOTICE.txt'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/libbox/cronet-naiveproxy/LICENSE'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/libbox/cronet-naiveproxy/src/LICENSE'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/libbox/'
          unzip -l "$AAB" | grep -q 'base/assets/index.html'
          echo "GPL-3.0 text and sing-box-lx notices are present in APK and AAB"

      - name: Package license and third-party notices
        run: |
          set -euo pipefail
          mkdir -p build/release-notices
          cp LICENSE THIRD_PARTY_NOTICES.md docs/OPEN_SOURCE_COMPLIANCE.md build/release-notices/
          cp -R app/src/main/assets/licenses build/release-notices/assets-licenses
          cp -R app/build/reports/dependency-license build/release-notices/gradle-report
          cp -R app/build/reports/license-audit build/release-notices/native-report
          (cd build/release-notices && zip -qr "$GITHUB_WORKSPACE/license-notices.zip" .)

      - name: Verify APK version matches resolved version
        id: ver
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt2 not found"
            exit 1
          fi
          APK=app/build/outputs/apk/direct/release/app-direct-universal-release.apk
          if [ ! -f "$APK" ]; then
            APK=$(find app/build/outputs/apk/direct/release -name 'app-direct-*-release.apk' | head -1)
          fi
          test -f "$APK"
          VN=$("$AAPT" dump badging "$APK" | head -1 | sed -E "s/.*versionName='([^']+)'.*/\1/")
          VC=$("$AAPT" dump badging "$APK" | head -1 | sed -E "s/.*versionCode='([^']+)'.*/\1/")
          EXPECT_NAME="${{ steps.version.outputs.name }}"
          EXPECT_CODE="${{ steps.version.outputs.code }}"
          if [ "$VN" != "$EXPECT_NAME" ] || [ "$VC" != "$EXPECT_CODE" ]; then
            echo "::error::APK version mismatch: APK=${VN}/${VC} expected=${EXPECT_NAME}/${EXPECT_CODE}"
            exit 1
          fi
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "APK version OK: $VN ($VC)"

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo "changelog<<EOF"
            echo "## Что нового"
            git log -20 --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD || git log -20 --pretty=format:"- %s (%h)"
            echo ""
            echo "**Full SHA:** \`${{ github.sha }}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate version.json
        run: |
          mkdir -p release-meta
          cat > release-meta/version.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}",
            "gitSha": "${{ github.sha }}"
          }
          EOF
          cat release-meta/version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-direct-${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/direct/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: aab-play-${{ steps.ver.outputs.name }}
          path: app/build/outputs/bundle/playRelease/*.aab

      - name: Verify release APK files exist
        run: |
          set -euo pipefail
          DIR=app/build/outputs/apk/direct/release
          for f in \
            "$DIR/app-direct-universal-release.apk" \
            "$DIR/app-direct-arm64-v8a-release.apk" \
            "$DIR/app-direct-armeabi-v7a-release.apk" \
            "$DIR/app-direct-x86_64-release.apk"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing expected APK: $f"
              exit 1
            fi
            echo "✅ $f ($(du -h "$f" | cut -f1))"
          done

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: VPNProxy v${{ steps.ver.outputs.name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            app/build/outputs/apk/direct/release/app-direct-*-release.apk
            app/build/outputs/bundle/playRelease/*.aab
            LICENSE
            THIRD_PARTY_NOTICES.md
            license-notices.zip
            app/src/main/assets/licenses/GPL-3.0-or-later.txt
            app/src/main/assets/licenses/sing-box-lx-NOTICE.txt
            docs/OPEN_SOURCE_COMPLIANCE.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
