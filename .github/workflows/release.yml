name: Build, Sign & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK/licenses/android-sdk-license"
          printf '%s\n' \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$SDK/licenses/android-sdk-preview-license"
          printf '%s\n' \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK/licenses/android-sdk-arm-dbt-license"
          CMDLINE=$(find "$SDK/cmdline-tools" -name sdkmanager 2>/dev/null | head -1)
          if [ -n "$CMDLINE" ]; then
            yes | "$CMDLINE" --sdk_root="$SDK" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              || true
          fi
          echo "SDK ready at $SDK"

      - name: Bootstrap Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Download full libbox 1.14.3
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh
          unzip -p app/libs/libbox.aar classes.jar > /tmp/libbox-classes.jar
          jar tf /tmp/libbox-classes.jar | grep -q "^io/nekohasekai/libbox/PlatformInterface.class$"
          jar tf /tmp/libbox-classes.jar | grep -q "^go/Seq.class$"
          echo "Verified full libbox 1.14.3 with Go bridge classes"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "::error::KEYSTORE_BASE64 is required for a production release"
              exit 1
            fi
            echo "Release signing secrets unavailable (non-release build); Gradle may use debug signing."
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name secret is required for a production release"
                exit 1
              fi
            done
          fi
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r \t')
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.keystore"
          SIZE=$(wc -c < "$RUNNER_TEMP/release.keystore")
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore too small ($SIZE bytes) — check KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "Keystore decoded OK ($SIZE bytes)"

      - name: Build Direct Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDirectRelease --stacktrace

      - name: Validate every APK before publishing
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"

          shopt -s nullglob
          apks=(app/build/outputs/apk/direct/release/*.apk)
          (("${#apks[@]}" >= 2)) || { echo "::error::Expected universal + at least 1 ABI APK; found ${#apks[@]}"; exit 1; }

          cert_digests=()
          expected_version_code=""
          for apk in "${apks[@]}"; do
            "$ZIPALIGN" -c -v 4 "$apk" >/dev/null || { echo "::error::APK not zipaligned: $apk"; exit 1; }
            "$APKSIGNER" verify --print-certs "$apk" >/dev/null || { echo "::error::APK signature invalid: $apk"; exit 1; }

            cert="$( "$APKSIGNER" verify --print-certs "$apk" | grep -m1 "SHA-256 digest" | awk -F': ' '{print $2}' | tr -d '[:space:]' )"
            test -n "$cert" || { echo "::error::No signer certificate found in $apk"; exit 1; }
            cert_digests+=("$cert")

            version_code="$("$AAPT" dump badging "$apk" 2>/dev/null | grep -oP "versionCode='\\K[^']+" || true)"
            [[ "$version_code" =~ ^[0-9]+$ ]] || { echo "::error::Invalid or missing versionCode in $apk: '$version_code'"; exit 1; }
            if [[ -z "$expected_version_code" ]]; then
              expected_version_code="$version_code"
            elif [[ "$version_code" != "$expected_version_code" ]]; then
              echo "::error::versionCode differs between APKs: expected $expected_version_code, got $version_code in $apk"
              exit 1
            fi
            echo "Validated $apk: versionCode=$version_code"
          done

          unique_certs="$(printf '%s\n' "${cert_digests[@]}" | sort -u | wc -l | tr -d '[:space:]')"
          if [[ "$unique_certs" -ne 1 ]]; then
            echo "::error::APK signing certificate differs between split artifacts"
            exit 1
          fi

          echo "::notice::All APKs passed validation with a single signing certificate and versionCode $expected_version_code."

      - name: Verify APK excludes retired native cores and secondary process
        run: |
          set -euo pipefail
          if grep -q 'android:process=":singbox"' app/src/main/AndroidManifest.xml; then
            echo "Unexpected :singbox process declaration"
            exit 1
          fi
          found=0
          while IFS= read -r apk; do
            found=1
            if unzip -l "$apk" | grep -E 'libv2ray\.so|libhev-socks5-tunnel\.so'; then
              echo "Retired native core found in $apk"
              exit 1
            fi
          done < <(find app/build/outputs/apk/direct/release -name '*.apk' -type f)
          test "$found" -eq 1
          echo "Verified direct APKs contain neither retired native core"

      - name: Build Play Release AAB
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease --stacktrace

      - name: Extract version info
        id: ver
        run: |
          set -euo pipefail

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          if [ -z "$AAPT" ]; then
            echo "❌ aapt2 not found in \$ANDROID_HOME/build-tools"
            exit 1
          fi

          # Gradle flavor+splits naming: app-<flavor>-<abi>-<buildType>.apk
          APK=app/build/outputs/apk/direct/release/app-direct-universal-release.apk

          # Fallback: any APK if universal missing (defensive)
          if [ ! -f "$APK" ]; then
            APK=$(find app/build/outputs/apk/direct/release -name 'app-direct-*-release.apk' | head -1)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "❌ No release APK found. Directory listing:"
            ls -la app/build/outputs/apk/direct/release/ || true
            exit 1
          fi

          echo "Using APK: $APK"
          VN=$("$AAPT" dump badging "$APK" | head -1 | sed -E "s/.*versionName='([^']+)'.*/\1/")
          VC=$("$AAPT" dump badging "$APK" | head -1 | sed -E "s/.*versionCode='([^']+)'.*/\1/")
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Detected $VN ($VC)"

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo "changelog<<EOF"
            echo "## Что нового"
            git log -20 --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD || git log -20 --pretty=format:"- %s (%h)"
            echo ""
            echo "**Full SHA:** \`${{ github.sha }}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate version.json
        run: |
          mkdir -p release-meta
          cat > release-meta/version.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}"
          }
          EOF
          cat release-meta/version.json

      - name: Install APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-boot-timeout: 600
          disable-animations: false
          script: |
            set -eu

            # Wait for PackageManager to become responsive after Android reports boot complete.
            package_manager_ready=false
            for i in $(seq 1 60); do
              if adb shell pm path android >/dev/null 2>&1; then
                package_manager_ready=true
                echo "PackageManager ready"
                break
              fi
              sleep 2
            done
            if [ "$package_manager_ready" != true ]; then
              echo "::error::PackageManager did not become ready within 120 seconds"
              adb logcat -d -t 300 || true
              exit 1
            fi

            adb install -r app/build/outputs/apk/direct/release/app-direct-x86_64-release.apk

            installed_packages="$(adb shell pm list packages)"
            printf '%s\n' "$installed_packages"
            if ! printf '%s\n' "$installed_packages" | grep -F 'com.vpnproxy'; then
              echo "::error::Installed APK package was not found; package list shown above"
              adb shell dumpsys package 2>/dev/null | grep -i -E 'vpnproxy|versionCode|versionName' || true
              exit 1
            fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-direct-${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/direct/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: aab-play-${{ steps.ver.outputs.name }}
          path: app/build/outputs/bundle/playRelease/*.aab

      - name: Verify release APK files exist
        run: |
          set -euo pipefail
          DIR=app/build/outputs/apk/direct/release
          for f in \
            "$DIR/app-direct-universal-release.apk" \
            "$DIR/app-direct-arm64-v8a-release.apk" \
            "$DIR/app-direct-armeabi-v7a-release.apk" \
            "$DIR/app-direct-x86_64-release.apk"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing expected APK: $f"
              echo "Directory contents:"
              ls -la "$DIR"
              exit 1
            fi
            echo "✅ $f ($(du -h "$f" | cut -f1))"
          done

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: VPNProxy v${{ steps.ver.outputs.name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            app/build/outputs/apk/direct/release/app-direct-*-release.apk
            app/build/outputs/bundle/playRelease/*.aab
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
