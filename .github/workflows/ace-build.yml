name: ACE Native + App Compile

on:
  workflow_dispatch:
  push:
    branches: [feat/ace-foundation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '%s\n' "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"
          CMDLINE=$(find "$SDK/cmdline-tools" -name sdkmanager 2>/dev/null | head -1 || true)
          if [ -n "$CMDLINE" ]; then
            yes | "$CMDLINE" --sdk_root="$SDK" \
              "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" || true
          fi
          echo "SDK ready at $SDK"

      - name: Set up Rust (stable + Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk + uniffi-bindgen
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          # Binary is provided by the uniffi crate with feature cli, or uniffi_bindgen package.
          cargo install uniffi_bindgen --version 0.28.3 --locked \
            || cargo install uniffi --version 0.28.3 --features cli --locked
          command -v uniffi-bindgen
          uniffi-bindgen --version || true

      - name: Host Rust unit tests
        run: |
          cd ace-core
          cargo test --release 2>&1 | tee ../cargo-test.log

      - name: Build ace-core for Android (cargo-ndk)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK" ]; then
            echo "FATAL: NDK not found under $SDK/ndk"
            exit 1
          fi
          export ANDROID_NDK_HOME="$NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          mkdir -p app/src/main/jniLibs
          cd ace-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../app/src/main/jniLibs \
            build --release
          echo "=== .so files ==="
          find ../app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;
          test -f ../app/src/main/jniLibs/arm64-v8a/libace_core.so \
            || (echo "FATAL: arm64-v8a/libace_core.so missing" && exit 1)

      - name: Generate UniFFI Kotlin bindings (required)
        run: |
          set -euo pipefail
          uniffi-bindgen generate ace-core/src/ace_core.udl \
            --language kotlin \
            --out-dir app/src/main/java
          echo "=== generated UniFFI tree ==="
          find app/src/main/java -iname '*ace*' -type f | head -50
          if ! find app/src/main/java -type f -name '*.kt' | grep -qi 'ace_core\|uniffi'; then
            echo "FATAL: UniFFI Kotlin bindings not generated"
            exit 1
          fi

      - name: Bootstrap Gradle wrapper if needed
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl --fail --silent --location -o /tmp/gradle.zip \
              https://services.gradle.org/distributions/gradle-8.14.6-bin.zip
            unzip -p /tmp/gradle.zip gradle-8.14.6/lib/plugins/gradle-wrapper-main-8.14.6.jar > /tmp/gwm.jar
            unzip -p /tmp/gwm.jar gradle-wrapper.jar > gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - name: Download libbox AAR
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh

      - name: Compile production Direct variant (no APK packaging)
        run: ./gradlew :app:compileDirectReleaseKotlin --stacktrace

      - name: Compile Direct debug Kotlin sources (no APK packaging)
        run: ./gradlew :app:compileDirectDebugKotlin --stacktrace

      - name: Upload logs and native libs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-build-logs
          path: |
            cargo-test.log
            app/src/main/jniLibs/**/*.so
          if-no-files-found: warn
