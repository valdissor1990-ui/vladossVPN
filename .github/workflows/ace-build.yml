name: Ace Build

on:
  workflow_dispatch:
  push:
    branches: [feat/ace-foundation]

# Never publish production from this workflow.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" || true

      - name: Set up Rust (stable + Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Host Rust unit tests
        run: |
          cd ace-core
          cargo test --release 2>&1 | tee ../cargo-test.log

      - name: Build ace-core for Android (cargo-ndk)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          # Prefer NDK from sdkmanager install path if env not set
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$NDK" ]; then
              export ANDROID_NDK_HOME="$NDK"
              echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            fi
          fi
          mkdir -p app/src/main/jniLibs
          cd ace-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../app/src/main/jniLibs \
            build --release
          echo "=== jniLibs tree ==="
          find ../app/src/main/jniLibs -type f -name '*.so' -exec ls -lh {} \;

      - name: Generate UniFFI Kotlin bindings (best-effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          # Host crate currently has no UniFFI dep (MSRV). When UDL + uniffi are restored,
          # this step produces Kotlin under app/src/main/java.
          if [ -f ace-core/src/ace_core.udl ]; then
            cargo install uniffi-bindgen-cli --version 0.28.3 --locked || cargo install uniffi-bindgen --locked || true
            if command -v uniffi-bindgen >/dev/null 2>&1; then
              uniffi-bindgen generate ace-core/src/ace_core.udl \
                --language kotlin \
                --out-dir app/src/main/java || true
            else
              echo "uniffi-bindgen not available; AceNativeBridge stub remains"
            fi
          else
            echo "No UDL; skip bindgen"
          fi

      - name: Bootstrap Gradle wrapper JAR if missing
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl --fail --silent --location -o /tmp/gradle.zip \
              https://services.gradle.org/distributions/gradle-8.14.6-bin.zip
            unzip -p /tmp/gradle.zip gradle-8.14.6/lib/plugins/gradle-wrapper-main-8.14.6.jar \
              > /tmp/gwm.jar
            unzip -p /tmp/gwm.jar gradle-wrapper.jar > gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - name: Download libbox AAR
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh

      - name: Assemble Direct Debug APK
        run: ./gradlew :app:assembleDirectDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vladoss-ace-stage-b-debug-apk
          path: app/build/outputs/apk/direct/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload logs and native libs listing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-logs
          path: |
            cargo-test.log
            app/src/main/jniLibs/**/*.so
          if-no-files-found: warn
