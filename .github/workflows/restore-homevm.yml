name: Restore HomeViewModel on battery branch
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/battery-optimization
          fetch-depth: 0
      - name: Restore HomeViewModel from last good commit and apply combine patch
        run: |
          set -euo pipefail
          git show c8bcce52d8210c074d5a3b8c74ffe612516137ae:app/src/main/java/com/vpnproxy/ui/home/HomeViewModel.kt > app/src/main/java/com/vpnproxy/ui/home/HomeViewModel.kt
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/vpnproxy/ui/home/HomeViewModel.kt')
          text = p.read_text()
          old_imp = '''import kotlinx.coroutines.flow.MutableStateFlow\nimport kotlinx.coroutines.flow.StateFlow\nimport kotlinx.coroutines.flow.asStateFlow'''
          new_imp = '''import kotlinx.coroutines.flow.MutableStateFlow\nimport kotlinx.coroutines.flow.StateFlow\nimport kotlinx.coroutines.flow.asStateFlow\nimport kotlinx.coroutines.flow.collect\nimport kotlinx.coroutines.flow.combine'''
          if old_imp not in text:
              raise SystemExit('import block missing')
          text = text.replace(old_imp, new_imp, 1)
          old = '''        viewModelScope.launch {\n            subscriptionRepository.allConfigs.collect { configs ->\n                val merged = jsonConfigRepository.allConfigsIncluding(configs)\n                _uiState.value = _uiState.value.copy(serverCount = merged.distinctBy { it.connectionKey() }.size)\n            }\n        }'''
          new = '''        viewModelScope.launch {\n            // React to both subscription refreshes and local JSON imports.\n            combine(\n                subscriptionRepository.allConfigs,\n                jsonConfigRepository.configs\n            ) { subscriptionConfigs, _ ->\n                jsonConfigRepository.allConfigsIncluding(subscriptionConfigs)\n            }.collect { merged ->\n                _uiState.value = _uiState.value.copy(\n                    serverCount = merged.distinctBy { it.connectionKey() }.size\n                )\n            }\n        }'''
          if old not in text:
              raise SystemExit('collect block missing')
          text = text.replace(old, new, 1)
          p.write_text(text)
          print('patched size', p.stat().st_size)
          PY
          test $(wc -c < app/src/main/java/com/vpnproxy/ui/home/HomeViewModel.kt) -gt 24000
          grep -q 'combine(' app/src/main/java/com/vpnproxy/ui/home/HomeViewModel.kt
          grep -q 'jsonConfigRepository.configs' app/src/main/java/com/vpnproxy/ui/home/HomeViewModel.kt
          grep -q 'fun disconnect' app/src/main/java/com/vpnproxy/ui/home/HomeViewModel.kt
          # remove accidental placeholder parts if present
          rm -rf tools/patches/homevm-restore || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/vpnproxy/ui/home/HomeViewModel.kt
          git add -u tools/patches/homevm-restore || true
          git commit -m 'fix(home): restore full HomeViewModel + serverCount combine for JSON'
          git push origin feat/battery-optimization
