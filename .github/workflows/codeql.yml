name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Kotlin and Java
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          CMDLINE=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          test -n "$CMDLINE"
          set +o pipefail
          yes | "$CMDLINE" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          set -o pipefail

      - name: Bootstrap and verify Gradle Wrapper JAR
        env:
          WRAPPER_JAR_SHA256: ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0
          GRADLE_DIST_SHA256: 7988ed071b2a07900e2ec715fca15c6ab72bce6db433af301fa7fa7e9407bd24
        run: |
          set -euo pipefail
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl --fail --show-error --silent --location \
              --proto '=https' --tlsv1.2 \
              -o "$RUNNER_TEMP/gradle-8.14.6-bin.zip" \
              https://services.gradle.org/distributions/gradle-8.14.6-bin.zip
            echo "${GRADLE_DIST_SHA256}  $RUNNER_TEMP/gradle-8.14.6-bin.zip" | sha256sum --check
            unzip -p "$RUNNER_TEMP/gradle-8.14.6-bin.zip" \
              gradle-8.14.6/lib/plugins/gradle-wrapper-main-8.14.6.jar \
              > "$RUNNER_TEMP/gradle-wrapper-main.jar"
            unzip -p "$RUNNER_TEMP/gradle-wrapper-main.jar" gradle-wrapper.jar \
              > gradle/wrapper/gradle-wrapper.jar
          fi
          echo "${WRAPPER_JAR_SHA256}  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
          chmod +x gradlew || true

      - name: Download and verify pinned libbox AAR
        run: |
          set -euo pipefail
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh
          unzip -p app/libs/libbox.aar classes.jar > "$RUNNER_TEMP/libbox-classes.jar"
          jar tf "$RUNNER_TEMP/libbox-classes.jar" | grep -q '^io/nekohasekai/libbox/PlatformInterface.class$'
          jar tf "$RUNNER_TEMP/libbox-classes.jar" | grep -q '^go/Seq.class$'

      - name: Set up Rust for UniFFI binding generation
        uses: dtolnay/rust-toolchain@stable

      - name: Install UniFFI bindgen CLI
        run: |
          set -euo pipefail
          cargo install --git https://github.com/mozilla/uniffi-rs --tag v0.28.3 uniffi-bindgen-cli --locked
          command -v uniffi-bindgen
          uniffi-bindgen --version

      - name: Generate UniFFI Kotlin bindings
        run: |
          set -euo pipefail
          uniffi-bindgen generate ace-core/src/ace_core.udl \
            --language kotlin \
            --out-dir app/src/main/java
          find app/src/main/java -type f -name '*.kt' | grep -qi 'ace_core\|uniffi'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build Kotlin and Java sources for CodeQL extraction
        run: ./gradlew :app:compileDirectDebugKotlin :app:compilePlayDebugKotlin --no-daemon --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
