name: Refresh subscription mirror

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/subscription-mirror.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mirror-data
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Fetch subscription list
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 90 \
            "https://gitverse.ru/api/repos/zieng2/wl/raw/branch/master/list_universal.txt" \
            --output list_universal.txt
          test -s list_universal.txt
          if grep -qiE '<!doctype html|<html' list_universal.txt; then
            echo "GitVerse returned HTML instead of a subscription list"
            exit 1
          fi

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add list_universal.txt
          if git diff --cached --quiet; then
            echo "Mirror is already up to date"
            exit 0
          fi
          git commit -m "chore: refresh subscription mirror"
          git push origin HEAD:mirror-data
