name: Apply SubRepo JSON Patch
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/battery-optimization
      - name: Decode SubscriptionRepository
        run: |
          set -euo pipefail
          cat tools/patches/subrepo-json/*.b64 | tr -d '\n' | base64 -d > app/src/main/java/com/vpnproxy/subscription/SubscriptionRepository.kt
          SIZE=$(wc -c < app/src/main/java/com/vpnproxy/subscription/SubscriptionRepository.kt)
          echo "decoded size=$SIZE"
          test "$SIZE" -gt 20000
          grep -q addFromJsonConfig app/src/main/java/com/vpnproxy/subscription/SubscriptionRepository.kt
          grep -q INLINE_JSON_PREFIX app/src/main/java/com/vpnproxy/subscription/SubscriptionRepository.kt
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/vpnproxy/subscription/SubscriptionRepository.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(json): addFromJsonConfig + inline-json storage in SubscriptionRepository"
            git push
          fi
