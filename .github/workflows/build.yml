name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download full sing-box-lx libbox 1.14.3-lx.21
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh

      - name: Bootstrap Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - name: Build Direct Release APK
        run: ./gradlew assembleDirectRelease --stacktrace

      - name: Verify APK excludes retired native cores and secondary process
        run: |
          set -euo pipefail
          if grep -q 'android:process=":singbox"' app/src/main/AndroidManifest.xml; then
            echo "Unexpected :singbox process declaration"
            exit 1
          fi
          found=0
          while IFS= read -r apk; do
            found=1
            if unzip -l "$apk" | grep -E 'libv2ray\.so|libhev-socks5-tunnel\.so'; then
              echo "Retired native core found in $apk"
              exit 1
            fi
          done < <(find app/build/outputs/apk/direct/release -name '*.apk' -type f)
          test "$found" -eq 1
          echo "Verified direct APKs contain neither retired native core"

      - name: Build Play Release AAB
        run: ./gradlew bundlePlayRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apk-direct
          path: app/build/outputs/apk/direct/release/*.apk

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aab-play
          path: app/build/outputs/bundle/playRelease/*.aab

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: apk-direct
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
