name: Pull Request Build Validation

on:
  pull_request:
    branches: [main]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  build:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download full sing-box-lx libbox 1.14.3-lx.23
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh

      - name: Bootstrap Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - name: Compile Direct Debug Kotlin
        run: ./gradlew :app:compileDirectDebugKotlin --stacktrace

      - name: Clean and build Direct Debug APK
        run: ./gradlew clean :app:assembleDirectDebug --stacktrace

      - name: Upload Direct Debug APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apk-direct-debug
          path: app/build/outputs/apk/direct/debug/*.apk

