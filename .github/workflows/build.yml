name: Pull Request Build Validation

on:
  pull_request:
    branches: [main]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  build:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download full sing-box-lx libbox 1.14.3-lx.23
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh

      - name: Bootstrap Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - name: Set up Rust for ACE (when ACE crate is present)
        if: ${{ hashFiles('ace-core/Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk and UniFFI bindgen for ACE
        if: ${{ hashFiles('ace-core/Cargo.toml') != '' }}
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          cargo install --git https://github.com/mozilla/uniffi-rs --tag v0.28.3 uniffi-bindgen-cli --locked
          command -v uniffi-bindgen

      - name: Run ACE Rust host tests
        if: ${{ hashFiles('ace-core/Cargo.toml') != '' }}
        run: cargo test --release --manifest-path ace-core/Cargo.toml

      - name: Install Android NDK for ACE
        if: ${{ hashFiles('ace-core/Cargo.toml') != '' }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CMDLINE=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [ -z "$CMDLINE" ]; then
            echo "FATAL: Android sdkmanager not found"
            exit 1
          fi
          "$CMDLINE" --sdk_root="$SDK" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Build ACE Android native libraries
        if: ${{ hashFiles('ace-core/Cargo.toml') != '' }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs
          cd ace-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            build --release
          cd "$GITHUB_WORKSPACE"
          test -f app/src/main/jniLibs/arm64-v8a/libace_core.so

      - name: Generate ACE UniFFI Kotlin bindings
        if: ${{ hashFiles('ace-core/Cargo.toml') != '' }}
        run: |
          set -euo pipefail
          uniffi-bindgen generate ace-core/src/ace_core.udl \
            --language kotlin \
            --out-dir app/src/main/java
          test -f app/src/main/java/uniffi/ace_core/ace_core.kt

      - name: Compile Direct Debug Kotlin
        run: ./gradlew :app:compileDirectDebugKotlin --stacktrace


