name: Unit Tests

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'chore/**', 'hotfix/**' ]
  pull_request:
    branches: [main]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Bootstrap Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - name: Write SOURCE_COMMIT
        run: |
          mkdir -p app/src/main/assets/licenses
          cat > app/src/main/assets/licenses/SOURCE_COMMIT.txt <<EOF
          VLADOSS VPN source commit: $GITHUB_SHA
          Source: https://github.com/valdissor1990-ui/vladossVPN/tree/$GITHUB_SHA
          Bundled libbox source: https://github.com/Leadaxe/sing-box-lx/tree/v1.14.3-lx.23
          Bundled cronet-go wrapper: https://github.com/SagerNet/cronet-go/tree/0d28acc44093df24b2526dea3d6ffefd6b0a54f0
          Bundled libcronet.a source: https://github.com/SagerNet/naiveproxy/tree/72a06c9fca0e2d228588c7f3074bf7efff3ff686
          EOF

      - name: Download libbox
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh

      - name: Audit bundled libbox Go dependencies
        run: bash scripts/audit_libbox_licenses.sh

      - name: Unit tests
        run: ./gradlew testDirectDebugUnitTest --stacktrace

      - name: Build Direct Release APK (license asset check)
        run: ./gradlew assembleDirectRelease --stacktrace

      - name: Build Play Release AAB (license asset check)
        run: ./gradlew bundlePlayRelease --stacktrace

      - name: Verify license assets in APK/AAB
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/direct/release -name '*.apk' -type f | head -1)
          AAB=$(find app/build/outputs/bundle/playRelease -name '*.aab' -type f | head -1)
          test -n "$APK" && test -n "$AAB"
          unzip -l "$APK" | grep -q 'assets/licenses/libbox-go-licenses.csv'
          unzip -l "$APK" | grep -q 'assets/licenses/libbox/cronet-naiveproxy/LICENSE'
          unzip -l "$APK" | grep -q 'assets/licenses/libbox/cronet-naiveproxy/src/LICENSE'
          unzip -l "$APK" | grep -q 'assets/licenses/libbox/'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/libbox-go-licenses.csv'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/libbox/cronet-naiveproxy/LICENSE'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/libbox/cronet-naiveproxy/src/LICENSE'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/libbox/'
