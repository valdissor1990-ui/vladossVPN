name: Unit Tests

on:
  push:
    branches: [ main, 'feat/**', 'chore/**' ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Bootstrap Gradle Wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Download native libs
        run: |
          chmod +x scripts/download_libbox.sh
          ./scripts/download_libbox.sh
          ls -la app/libs/

      - uses: actions/setup-go@v6
        if: github.ref == 'refs/heads/chore/open-source-license-compliance'
        with:
          go-version: '1.26.8'

      - name: Audit bundled libbox Go dependencies
        if: github.ref == 'refs/heads/chore/open-source-license-compliance'
        run: bash scripts/audit_libbox_licenses.sh

      - name: Generate dependency license report
        run: ./gradlew :app:generateLicenseReport --no-parallel --stacktrace

      - name: Upload dependency license report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-license-report
          path: |
            app/build/reports/dependency-license/**
            app/build/reports/license-audit/**
          if-no-files-found: warn

      - name: Run unit tests
        run: ./gradlew testDirectDebugUnitTest --stacktrace

      - name: Build release variants for license asset verification
        if: github.ref == 'refs/heads/chore/open-source-license-compliance'
        run: ./gradlew assembleDirectRelease bundlePlayRelease --stacktrace

      - name: Verify license assets in release APK and AAB
        if: github.ref == 'refs/heads/chore/open-source-license-compliance'
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/direct/release/app-direct-universal-release.apk
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          test -f "$APK"
          test -f "$AAB"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/licenses/GPL-3.0-or-later.txt'
          unzip -l "$APK" | grep -q 'assets/licenses/sing-box-lx-NOTICE.txt'
          unzip -l "$APK" | grep -q 'assets/licenses/libbox-go-licenses.csv'
          unzip -l "$APK" | grep -q 'assets/licenses/libbox/'
          unzip -l "$APK" | grep -q 'assets/licenses/gradle/'
          unzip -l "$AAB" | grep -q 'base/assets/index.html'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/GPL-3.0-or-later.txt'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/sing-box-lx-NOTICE.txt'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/libbox-go-licenses.csv'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/libbox/'
          unzip -l "$AAB" | grep -q 'base/assets/licenses/gradle/'
          echo "License inventories and texts are present in both release artifacts"

      - name: Upload release variants for license verification
        if: always() && github.ref == 'refs/heads/chore/open-source-license-compliance'
        uses: actions/upload-artifact@v7
        with:
          name: license-compliance-release-build
          path: |
            app/build/outputs/apk/direct/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/test-results/testDirectDebugUnitTest/*.xml'

      - name: Upload test report HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-html
          path: '**/build/reports/tests/testDirectDebugUnitTest/**'
