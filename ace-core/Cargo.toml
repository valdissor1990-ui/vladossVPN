[package]
name = "ace-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Vladoss ACE Control Plane — Stage B smoke foundation"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "ace_core"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[dependencies]
once_cell = "1"
parking_lot = "0.12"
log = "0.4"
thiserror = "1"

# UniFFI is intentionally not a host dependency in Stage B.
# Device .so + Kotlin bindings will be added with cargo-ndk on a
# machine that has Android NDK and a Rust toolchain that supports
# the chosen UniFFI version (see docs/ace/BENCHMARK_ARM64.md).
